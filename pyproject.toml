[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spirrow-conclair"
version = "0.1.0"
description = "Chatroom persistence backend (FastAPI + PostgreSQL) for AI-to-AI coordination"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SpirrowGames" }
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "testcontainers[postgres]>=4.7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
spirrow-conclair = "spirrow_conclair.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spirrow_conclair"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
