{% if result.items %}
    {% for t in result.items %}
    <tr>
        <td>
            <a href="/ui/projects/{{ project }}/threads/{{ t.thread_id }}">
                <code>{{ t.thread_id }}</code>
            </a>
        </td>
        <td>{{ t.title }}</td>
        <td><span class="status status-{{ t.status }}">{{ t.status }}</span></td>
        <td>{{ t.owner }}</td>
        <td>{{ t.created_at | iso }}</td>
    </tr>
    {% endfor %}
{% else %}
    <tr>
        <td colspan="5" class="muted">no threads match these filters</td>
    </tr>
{% endif %}
