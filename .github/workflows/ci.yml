name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The integration suite spins a throw-away postgres:16 via testcontainers,
# so it needs a Docker daemon. That is why it had never run anywhere except
# a developer machine that happened to have one -- and why a PR could
# previously arrive with its own tests unexecuted.
#
# Lint (ruff) and types (mypy) are deliberately NOT gated here yet: both
# report pre-existing findings on main, so a gate would be red on arrival
# and would train everyone to ignore it. Clearing them is its own task.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # The unit suite instantiates Settings (which requires DATABASE_URL)
      # without ever connecting; the integration suite overrides this with
      # the container's real URL.
      DATABASE_URL: postgresql+asyncpg://unused:unused@127.0.0.1:5432/unused

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Unit tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit -q

      - name: Integration tests (testcontainers postgres:16)
        run: uv run --python ${{ matrix.python-version }} pytest tests/integration -q
